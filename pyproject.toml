[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hcag"
version = "0.1.0"
description = "Hierarchical Context Augmented Generation — a knowledge-taxonomy pattern for agentic AI"
readme = "DESIGN.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HCAG Authors" }]

dependencies = [
    "litellm>=1.50.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.11",
    "trafilatura>=2.0",
    # `crypto` pulls in `cryptography`, which pypdf needs for AES-encrypted
    # PDFs. Not optional in practice: government forms are routinely AES
    # encrypted, and 3 of the 21 PDFs in a single mom.gov.sg crawl failed to
    # convert without it (§4.3.4 made these reachable).
    "pypdf[crypto]>=4.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
otel-grpc = [
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
]
image = ["pillow>=10.0"]
voice = [
    "livekit-agents>=0.10",
    "livekit-plugins-deepgram>=0.6",
    "livekit-plugins-elevenlabs>=0.7",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "livekit-api>=0.7",
]
rag = [
    "lancedb>=0.13",
    "pyarrow>=15",
    "pillow>=10",
    "tantivy>=0.22",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hcag = "hcag.cli.main:app"
crawl = "hcag.crawl.main:main"
hcag-voice = "hcag.voice.main:main"
hcag-server = "hcag.server.main:main"
evalgen = "hcag.evalgen.main:main"
eval = "hcag.eval.main:main"
rag = "hcag.rag.main:main"

[tool.hatch.build.targets.wheel]
packages = ["hcag"]
exclude = [
    "hcag/web/node_modules",
    "hcag/web/.next",
    "hcag/web/out",
    "hcag/web/build",
    "hcag/web/dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
