<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img"
     aria-label="Answer quality by question difficulty, mean judge score as a percentage of the maximum. HCAG stays between 89 and 100 percent across simple, medium, complex and hard questions. Flat RAG falls from 84 percent on simple questions to 52 percent on hard questions that require two documents.">
  <rect width="760" height="420" fill="#ffffff"/>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="96" y="34" font-size="17" font-weight="700" fill="#24282c">Answer quality by question difficulty</text>
    <text x="96" y="56" font-size="12.5" fill="#6b737a">Mean judge score as a share of the maximum (3 of 3 = fully correct) · 58 SME-validated questions</text>
    <line x1="96" y1="336.0" x2="704" y2="336.0" stroke="#e6e9ee" stroke-width="1"/><text x="84" y="340.0" text-anchor="end" font-size="12" fill="#6b737a">0%</text><line x1="96" y1="274.0" x2="704" y2="274.0" stroke="#e6e9ee" stroke-width="1"/><text x="84" y="278.0" text-anchor="end" font-size="12" fill="#6b737a">25%</text><line x1="96" y1="212.0" x2="704" y2="212.0" stroke="#e6e9ee" stroke-width="1"/><text x="84" y="216.0" text-anchor="end" font-size="12" fill="#6b737a">50%</text><line x1="96" y1="150.0" x2="704" y2="150.0" stroke="#e6e9ee" stroke-width="1"/><text x="84" y="154.0" text-anchor="end" font-size="12" fill="#6b737a">75%</text><line x1="96" y1="88.0" x2="704" y2="88.0" stroke="#e6e9ee" stroke-width="1"/><text x="84" y="92.0" text-anchor="end" font-size="12" fill="#6b737a">100%</text>
    <polygon points="142.0,105.4 314.0,88.0 486.0,111.6 658.0,115.6 658.0,207.4 486.0,153.0 314.0,123.4 142.0,127.2" fill="#c53030" opacity="0.07"/>
    <polyline points="142.0,105.4 314.0,88.0 486.0,111.6 658.0,115.6" fill="none" stroke="#2f6f4f" stroke-width="3.5" stroke-linejoin="round"/>
    <polyline points="142.0,127.2 314.0,123.4 486.0,153.0 658.0,207.4" fill="none" stroke="#c53030" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="142.0" cy="105.4" r="5.5" fill="#fff" stroke="#2f6f4f" stroke-width="3"/><circle cx="314.0" cy="88.0" r="5.5" fill="#fff" stroke="#2f6f4f" stroke-width="3"/><circle cx="486.0" cy="111.6" r="5.5" fill="#fff" stroke="#2f6f4f" stroke-width="3"/><circle cx="658.0" cy="115.6" r="5.5" fill="#fff" stroke="#2f6f4f" stroke-width="3"/><circle cx="142.0" cy="127.2" r="5.5" fill="#fff" stroke="#c53030" stroke-width="3"/><circle cx="314.0" cy="123.4" r="5.5" fill="#fff" stroke="#c53030" stroke-width="3"/><circle cx="486.0" cy="153.0" r="5.5" fill="#fff" stroke="#c53030" stroke-width="3"/><circle cx="658.0" cy="207.4" r="5.5" fill="#fff" stroke="#c53030" stroke-width="3"/><text x="142.0" y="91.4" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6f4f">93%</text><text x="314.0" y="74.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6f4f">100%</text><text x="486.0" y="97.6" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6f4f">90%</text><text x="658.0" y="101.6" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6f4f">89%</text><text x="142.0" y="152.2" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">84%</text><text x="314.0" y="148.4" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">86%</text><text x="486.0" y="178.0" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">74%</text><text x="658.0" y="232.4" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">52%</text><text x="152.0" y="121.3" text-anchor="start" font-size="12.5" font-weight="700" fill="#a6adb5">+9 pts</text><text x="324.0" y="110.7" text-anchor="start" font-size="12.5" font-weight="700" fill="#a6adb5">+14 pts</text><text x="496.0" y="137.3" text-anchor="start" font-size="12.5" font-weight="700" fill="#a6adb5">+17 pts</text><text x="646.0" y="166.5" text-anchor="end" font-size="12.5" font-weight="700" fill="#a6adb5">+37 pts</text>
    <line x1="96" y1="336" x2="704" y2="336" stroke="#c3c9d1" stroke-width="1.5"/>
    <text x="142.0" y="364" text-anchor="middle" font-size="14.5" font-weight="600" fill="#24282c">Simple</text><text x="142.0" y="383" text-anchor="middle" font-size="11.5" fill="#6b737a">one lookup</text><text x="314.0" y="364" text-anchor="middle" font-size="14.5" font-weight="600" fill="#24282c">Medium</text><text x="314.0" y="383" text-anchor="middle" font-size="11.5" fill="#6b737a">one passage</text><text x="486.0" y="364" text-anchor="middle" font-size="14.5" font-weight="600" fill="#24282c">Complex</text><text x="486.0" y="383" text-anchor="middle" font-size="11.5" fill="#6b737a">3 passages, 1 doc</text><text x="658.0" y="364" text-anchor="middle" font-size="14.5" font-weight="600" fill="#24282c">Hard</text><text x="658.0" y="383" text-anchor="middle" font-size="11.5" fill="#6b737a">2 documents</text>
    <g transform="translate(114,252)">
      <line x1="0" y1="-5" x2="24" y2="-5" stroke="#2f6f4f" stroke-width="3.5"/>
      <text x="33" y="0" font-size="13.5" font-weight="700" fill="#2f6f4f">HCAG</text>
      <text x="33" y="18" font-size="12" fill="#6b737a">answer quality holds</text>
      <line x1="0" y1="37" x2="24" y2="37" stroke="#c53030" stroke-width="3.5"/>
      <text x="33" y="42" font-size="13.5" font-weight="700" fill="#c53030">Flat RAG</text>
      <text x="33" y="60" font-size="12" fill="#6b737a">quality falls as the answer spreads</text>
    </g>
  </g>
</svg>
