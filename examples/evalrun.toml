# ==============================================================================
# HCAG `evalrun` CLI — sample config (DESIGN §7.9)
#
# Score an evalgen-produced CSV against a live chatbot backend. Every field
# below has a CLI override (see `evalrun --help`) with precedence:
#   CLI > env > this file > defaults.
#
# The CLI is `evalrun`, not `eval`, because `eval` is a POSIX shell builtin
# and would shadow the command on any sh/bash/zsh.
# ==============================================================================

# ------------------------------------------------------------------------------
# Operator prompt overrides (§2.15.2). Drop `eval/score.md`, `eval/classify.md`
# or `eval/clarify.md` in here to override just that one; the rest keep the
# copies packaged with hcag. Variables are `$name` (string.Template), so a
# literal dollar sign is written `$$`.
# ------------------------------------------------------------------------------
prompts_dir = "./prompts"

# ------------------------------------------------------------------------------
# The chatbot backend under test.
# `eval` calls POST <url><chat_path> per row using the standard hcag-server
# contract: { session_id, message, history[] }.
# ------------------------------------------------------------------------------
[backend]
url             = "http://localhost:8000"
chat_path       = "/chat"
request_timeout = 60           # seconds
retries         = 2            # per-request retries on 5xx / timeouts
session_scope   = "per-question"   # per-question | per-run

# ------------------------------------------------------------------------------
# Multi-turn conversation loop (§7.4).
# ------------------------------------------------------------------------------
[loop]
max_turns = 5

# ------------------------------------------------------------------------------
# Small classifier LLM — decides whether a chatbot reply is an answer, a
# clarifying question, or a refusal. A fast/cheap model is fine here.
# ------------------------------------------------------------------------------
[classifier.llm]
provider    = "anthropic"
model       = "claude-haiku-4-5-20251001"
api_key_env = "ANTHROPIC_API_KEY"
max_tokens  = 64
temperature = 0.0

# Refuse to start if this model is unreachable, rather than discovering it
# after every row has been run against the backend (§7.3.1).
preflight   = true

# ------------------------------------------------------------------------------
# LLM-as-judge (§7.5). Also plays the clarifier role (§7.4.2), with distinct
# prompts. A strong model is recommended for scoring quality.
# ------------------------------------------------------------------------------
[judge.llm]
provider    = "anthropic"
model       = "claude-opus-4-7"
api_key_env = "ANTHROPIC_API_KEY"
max_tokens  = 512
temperature = 0.0
preflight   = true

# On malformed structured output, retry up to N times before leaving score empty.
[judge]
retries = 2

# ------------------------------------------------------------------------------
# Execution.
# ------------------------------------------------------------------------------
[run]
concurrency = 4                # parallel test cases (--max-concurrency in promptfoo)
# seed       = 42              # fixed seed => reproducible clarifier + judge sampling

# ------------------------------------------------------------------------------
# Reporting.
# ------------------------------------------------------------------------------
[report]
title    = "HCAG evalrun — work-pass KB"
baseline = ""                  # path to a prior --out CSV; renders per-kind deltas when set

# ------------------------------------------------------------------------------
# Local file log — JSON-lines, symmetric with the other CLIs (§7.11).
# ------------------------------------------------------------------------------
[log]
file_path = "./evalrun.log"
level     = "INFO"             # DEBUG | INFO | WARN | ERROR
